function monthly(type){return records.filter(r=>r.date.startsWith(month)&&(type==='tong'||r.type===type))}
function sums(type){let a=Array(8).fill(0);monthly(type).forEach(r=>r.counts.forEach((n,i)=>a[i]+=num(n)));return a}
function bracket(type,count){if(!count)return null;return RATE_TABLE[type].find((r,i,arr)=>count>=r[0]&&(count<r[1]||i===arr.length-1))||null}
function reward(type,count,i){const r=bracket(type,count);return r?r[i+2]*1000:0}
function total(type){return sums(type).reduce((a,n,i)=>a+reward(type,n,i),0)}
function allTotal(){return ['giao','lay','hoan'].reduce((a,t)=>a+total(t),0)}
function range(r){return r?(r[1]===999999?`${fmtInt(r[0])}+`:`${fmtInt(r[0])} - ${fmtInt(r[1])}`):'-'}
function fmtInt(n){return n.toLocaleString('vi-VN')}
function switchPage(p){page=p;render();window.scrollTo(0,0)}
function render(){let nav=$('#nav');nav.innerHTML=TYPES.map(t=>`<button class="${page===t.id?'active':''}" onclick="switchPage('${t.id}')"><span>${t.icon}</span>${t.label}</button>`).join('');$('#page').innerHTML=page==='tong'?renderSummary():renderType(page)}
function spxMoveMonth(step){const [y,m]=month.split('-').map(Number);const d=new Date(y,m-1+step,1);month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}
function monthControl(){const [year,mm]=month.split('-');return `<div class="spx-month-picker" aria-label="Chọn tháng thống kê"><button type="button" class="spx-month-arrow" aria-label="Tháng trước" onclick="spxMoveMonth(-1)">‹</button><label class="spx-month-center"><span class="spx-month-icon">▦</span><span class="spx-month-name">Tháng ${Number(mm)}<small>${year}</small></span><input class="spx-month-native" aria-label="Chọn tháng và năm" type="month" value="${month}" onchange="if(this.value){month=this.value;render()}"></label><button type="button" class="spx-month-arrow" aria-label="Tháng sau" onclick="spxMoveMonth(1)">›</button></div>`}
function renderType(type){const t=TYPES.find(t=>t.id===type),a=sums(type),count=a.reduce((x,y)=>x+y,0),money=total(type),b=bracket(type,count),recs=monthly(type).sort((x,y)=>y.date.localeCompare(x.date));return `
<div class="between" style="margin:0 0 14px"><b>${t.icon} ${t.label}</b>${monthControl()}</div>
<div class="card"><div class="flex"><div class="iconcircle greenCircle">💵</div><div><div class="muted">Số tiền nhận được (Theo mốc)</div><div class="big">${fmt(money)}</div><div class="tag">Tổng ${fmtInt(count)} đơn • ${month.split('-').reverse().join('/')}</div></div></div><div class="divider"></div><h3>Chi tiết theo từng mức cân nặng</h3>${detailTable(type,a)}<p class="foot">* Tiền mỗi mức cân là giá trị tích lũy tại mốc đang đạt, không cộng lại các mốc trước.</p></div>
<div style="margin-bottom:18px"><button class="btn full" onclick="choosePhotos()">✦ Quét từ ảnh</button></div>
<div class="card"><div class="between"><h2>Nhật ký sản lượng từng ngày</h2><b class="pill">${recs.length} ngày</b></div>${recs.length?recs.map(r=>renderRecord(r)).join(''):'<p class="muted">Chưa có dữ liệu. Nhấn “Quét từ ảnh” để bắt đầu.</p>'}</div>`}
function detailTable(type,a){return `<div class="tablewrap"><table><thead><tr><th>Cân nặng</th><th>Số đơn</th><th>Mốc tính</th><th>Thành tiền</th></tr></thead><tbody>${a.map((n,i)=>`<tr class="${n?'':'dim'}"><td>${WEIGHTS[i]}</td><td>${fmtInt(n)}</td><td>${range(bracket(type,n))}</td><td>${fmt(reward(type,n,i))}</td></tr>`).join('')}</tbody></table></div>`}
function renderRecord(r){const count=r.counts.reduce((a,b)=>a+num(b),0);return `<div class="entry"><div class="between"><b>📅 ${esc(r.date.split('-').reverse().join('/'))}</b><span class="pill">${count} đơn</span></div><div class="kicker" style="margin:8px 0">${r.counts.map((v,i)=>v?`${WEIGHTS[i]}: ${v}`:'').filter(Boolean).join(' • ')}</div><div class="rowactions"><button class="smallbtn" onclick="editRecord('${r.id}')">✎ Sửa</button><button class="smallbtn danger" onclick="deleteRecord('${r.id}')">🗑 Xóa</button></div></div>`}
function renderSummary(){let count=['giao','lay','hoan'].reduce((a,t)=>a+sums(t).reduce((x,y)=>x+y,0),0);return `<div class="between" style="margin-bottom:15px"><h2 style="margin:0">Tổng kết sản lượng</h2>${monthControl()}</div><div class="card"><div class="muted">Tổng tiền thưởng trong tháng</div><div class="big">${fmt(allTotal())}</div><div class="statgrid" style="margin-top:15px">${['giao','lay','hoan'].map(t=>`<div class="stat"><strong>${fmtInt(sums(t).reduce((a,b)=>a+b,0))}</strong><small>${TYPES.find(x=>x.id===t).label}</small><div class="money" style="font-size:12px;margin-top:7px">${fmt(total(t))}</div></div>`).join('')}</div></div><div class="card"><h2>💡 Gợi ý số đơn cần đạt mốc tiếp theo</h2>${['giao','lay','hoan'].map(t=>renderHints(t)).join('')}</div><div class="card"><h2>Nhật ký tất cả nhiệm vụ</h2>${monthly('tong').sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<div class="between entry"><div><b>${esc(r.date.split('-').reverse().join('/'))}</b><div class="muted">${TYPES.find(t=>t.id===r.type)?.label||r.type}</div></div><div><b>${r.counts.reduce((a,b)=>a+b,0)} đơn</b><div><button class="link" onclick="switchPage('${r.type}')">Xem</button></div></div></div>`).join('')||'<p class="muted">Chưa có dữ liệu.</p>'}</div>`}
function renderHints(t){let a=sums(t),count=a.reduce((x,y)=>x+y,0),r=bracket(t,count);let hints=a.map((n,i)=>{let current=bracket(t,n);let next=RATE_TABLE[t].find(row=>row[0]>=(current?current[1]:1));if(!next)return '';let need=Math.max(0,next[0]-n),gain=next[i+2]*1000-reward(t,n,i);if(gain<=0)return '';return {i,n,need,gain,range:range(current),next:range(next)}}).filter(Boolean).sort((a,b)=>a.i-b.i);return `<div class="between"><b>${TYPES.find(x=>x.id===t).icon} ${TYPES.find(x=>x.id===t).label}</b><span class="tag">${fmt(total(t))} • ${count} đơn</span></div><div class="progress"><div style="width:${r?Math.max(2,Math.min(100,100*(count-r[0])/Math.max(1,r[1]-r[0]))):0}%"></div></div>${hints.length?hints.map(h=>`<div class="hint"><div><b>${WEIGHTS[h.i]}</b> (${h.n} đơn)<br><span class="kicker">Cần thêm ${h.need} đơn để đạt mốc ${h.next}</span></div><em>+${fmt(h.gain)}</em></div>`).join(''):'<p class="muted">Chưa có mốc tiếp theo.</p>'}<div class="divider"></div>`}

function countFromText(text){const t=String(text||'').replace(/\n/g,' ');const m=t.match(/(?:^|\s)(\d{1,6})\s*(?:đ[oơ]n|d[oơ]n|don)/i);return m?Number(m[1]):null}

  let whole='';if(idx<0){whole=await cropOCR(worker,img,Math.round(W*.07),cropY,Math.round(W*.86),cropH,2.5);idx=weightIndex(whole)}

  const right=await cropOCR(worker,img,Math.round(W*.56),cropY,Math.round(W*.38),cropH,3.2);
  let value=countFromText(right);
  if(value===null&&whole)value=countFromText(whole);
  if(value===null){const m=right.match(/(?:^|\s)(\d{1,5})(?:\s|$)/);if(m)value=Number(m[1])}
  if(value!==null&&!seen.has(idx)){counts[idx]=value;seen.add(idx)}
  debug.push(WEIGHTS[idx]+': '+(value===null?'KHÔNG ĐỌC ĐƯỢC':value)+' | '+right.trim().replace(/\n/g,' '));
 }

}
async function readImage(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(file)})}
async function loadTesseract(){if(window.Tesseract)return;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('Không tải được bộ OCR. Kiểm tra kết nối Internet.'));document.head.appendChild(s)})}
async function selectedTab(data){
 // SPX screenshots show all three tab names: determine the active one from the orange underline.
 try{
  const im=new Image();im.src=data;await im.decode();
  const w=420,h=Math.round(im.height*w/im.width),c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0,w,h);
  const dataPx=ctx.getImageData(0,0,w,Math.min(h,Math.round(h*.40))).data;
  // Find solid orange horizontal strokes in the upper 40%, rather than counting orange text.
  const candidates=[];
  for(let y=Math.round(h*.08);y<Math.min(Math.round(h*.40),h);y++){
   let runStart=-1;
   for(let x=12;x<=w-12;x++){
    const k=(y*w+x)*4,r=dataPx[k],g=dataPx[k+1],b=dataPx[k+2];
    const orange=r>165&&r>g*1.35&&g>b*1.15&&g<175&&b<145;
    if(orange&&runStart<0)runStart=x;
    if((!orange||x===w-12)&&runStart>=0){const len=x-runStart;
     if(len>=13&&len<=85)candidates.push({x:runStart+len/2,y,len});runStart=-1;
    }
   }
  }
  // The tab underline is below the tab labels, typically around 16-27% of screenshot height.
  const tabLines=candidates.filter(v=>v.y>h*.11&&v.y<h*.31&&v.x<w*.82);
  if(!tabLines.length)return null;
  const groups=[0,0,0];for(const v of tabLines){const col=v.x<w*.31?0:v.x<w*.53?1:v.x<w*.78?2:-1;if(col>=0)groups[col]+=v.len;}

  return best>=26&&(sorted[1]===0||best>sorted[1]*1.65)?['giao','lay','hoan'][groups.indexOf(best)]:null;
 }catch(e){return null}
}
// SPX V9 FAST OCR: một lượt toàn ảnh; chỉ quét từng thẻ khi chưa đủ tin cậy.

    const p=$('#ocrProgress'),el=$('#ocrStatus');
    // Tiến trình theo số ảnh hoàn thành, không dùng % nội bộ của từng lượt OCR.
    if(el)el.textContent='Đang quét';
   }});
  })().catch(e=>{spxOCRWorkerPromise=null;throw e});

function spxScanProgress(percent){

function spxScanDialog(){return '<div style="text-align:center;padding:12px 0 18px"><h2>Đang quét...</h2><div id="ocrImageCount" style="font-size:16px;font-weight:700;margin:8px 0">0/0 ảnh</div><div id="ocrPercent" style="font-size:26px;font-weight:800;color:#fa4816;margin:15px 0">0%</div><progress id="ocrProgress" max="100" value="0" style="width:100%;height:14px;accent-color:#fa4816"></progress></div>'}

function spxSetStatus(message){const el=$('#ocrStatus');if(el)el.textContent='Đang quét'}
function spxSum(counts){return counts.reduce((a,b)=>a+(Number(b)||0),0)}
function spxValidCounts(parsed){

let spxWakeLock=null;

// Đọc tổng độc lập: ML Kit có thể tách "Tổng" và "119 đơn hàng" thành 2 dòng.
function spxReadTotal(result){
 // Chỉ đọc số ở khu vực "Tổng ... đơn hàng"; không tự gán tổng = cộng 8 mốc.
 const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').replace(/[–—]/g,'-').replace(/\s+/g,' ').trim();
 const totalPattern=/\b(?:tong|t0ng)\s*[:：.\-]?\s*(\d{1,6})\s*(?:d[o0]n\s*h[aà]ng|d[o0]n|don\s*hang|don)\b/i;
 const numericPattern=/(?:^|\s)(\d{1,6})\s*(?:d[o0]n\s*h[aà]ng|d[o0]n|don\s*hang|don)\b/i;
 const raw=norm(result.text);
 let m=raw.match(totalPattern);
 if(m)return Number(m[1]);
 const lines=(result.lines||[]).filter(x=>x&&x.text&&Number.isFinite(x.y)&&Number.isFinite(x.x));
 const titleLines=lines.filter(x=>/\b(?:tong|t0ng)\b/i.test(norm(x.text))&&!/tong\s*(?:ket|tien|hop)/i.test(norm(x.text)));
 // ML Kit có thể tách "Tổng" và "1 đơn hàng" thành hai khối riêng.
 for(const title of titleLines){
  const t=norm(title.text);
  m=t.match(totalPattern);
  if(m)return Number(m[1]);
  const row=lines.filter(x=>x!==title && Math.abs((x.y+x.h/2)-(title.y+title.h/2))<=Math.max(title.h,x.h,14)*1.5 && x.x>=title.x-title.w*.4)
   .sort((a,b)=>a.x-b.x);
  m=norm([title,...row].sort((a,b)=>a.x-b.x).map(x=>x.text).join(' ')).match(totalPattern);
  if(m)return Number(m[1]);
  for(const x of row){m=norm(x.text).match(numericPattern);if(m)return Number(m[1]);}
  // Chỉ cho phép dòng ngay dưới tiêu đề, ở vùng phía trên thẻ cân đầu tiên.
  const below=lines.filter(x=>x!==title && x.y>=title.y && x.y<=title.y+Math.max(title.h*3,40) && x.x>=title.x-title.w*.4)
   .sort((a,b)=>a.y-b.y||a.x-b.x);
  for(const x of below){m=norm(x.text).match(numericPattern);if(m)return Number(m[1]);}
 }

 for(const x of lines){m=norm(x.text).match(/^\s*(?:tong|t0ng)\s*[:：-]?\s*(\d{1,6})\s*$/i);if(m)return Number(m[1]);}

 const W=Number(result.width)||1,H=Number(result.height)||1;
 const lines=(result.lines||[]).filter(x=>x&&x.source!=='total-roi'&&Number.isFinite(Number(x.x))&&Number.isFinite(Number(x.y)))
  .map(x=>({text:String(x.text||''),x:+x.x,y:+x.y,w:+x.w||1,h:+x.h||1}))
  .sort((a,b)=>a.y-b.y||a.x-b.x);

  }
  candidates.sort((x,y)=>x.score-y.score);
  if(!candidates.length){unresolved++;debug.push(WEIGHTS[l.ix]+': không đọc được số | '+l.text);continue}

  if(candidates.some(c=>c.value!==candidates[0].value&&Math.abs(c.score-candidates[0].score)<W*.055)){
   conflicts++;debug.push(WEIGHTS[l.ix]+': số mâu thuẫn '+candidates.map(c=>c.value).join(','));continue;
  }

  debug.push(WEIGHTS[l.ix]+': '+candidates[0].value+' | '+l.text+' => '+candidates[0].why);
 }

 // Chỉ tự duyệt khi tổng khớp, không trùng nhãn, không thiếu số,
 // nhãn đều nằm trên ảnh và phần cuối ảnh còn khoảng trống đủ để thấy thẻ cuối.

const spxNavIcons={giao:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="12" height="10" rx="1"/><path d="M14 10h4l4 4v3h-8M2 17h2m8 0h6"/><circle cx="7" cy="18" r="2"/><circle cx="19" cy="18" r="2"/></svg>`,lay:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 7 9-5 9 5v11l-9 5-9-5zM3 7l9 5 9-5M12 12v11M7.5 4.5l9 5"/></svg>`,hoan:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 3 8l6-6M3 8h11a7 7 0 0 1 0 14h-4"/></svg>`,tong:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M6 18v-5M11 18V9M16 18v-7M21 18V5M3 11l6-5 4 3 8-7M17 2h4v4"/></svg>`,nhatky:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="17" rx="2"/><path d="M7 2v6M17 2v6M3 10h18M7 14h3M14 14h3M7 18h3M14 18h3"/></svg>`};render=function(){const bottom=[...TYPES.filter(t=>t.id!=='tong'),TYPES.find(t=>t.id==='tong')];$('#nav').innerHTML=bottom.map(t=>`<button class="${page===t.id?'active':''}" onclick="switchPage('${t.id}')"><span class="nav-icon">${spxNavIcons[t.id]}</span><span class="nav-label">${t.label}</span></button>`).join('');$('#page').innerHTML=page==='nhatky'?spxJournal():page==='tong'?renderSummary():renderType(page)};
function spxSettings(){showModal(`<div class="between"><h2>⚙ Cài đặt Sản Lượng Đơn</h2><button class="link" onclick="closeModal()">✕</button></div><p class="muted">Dữ liệu được lưu trên thiết bị. Có thể xuất bản sao CSV để lưu trữ.</p><button class="btn full" onclick="exportCSV()">Xuất bản sao dữ liệu CSV</button>`)}


/* SPX V9 upgrade: batch review, calendar, productivity, monthly goal. */
const spxBaseParseOCR=parseOCR;
function spxDateFromText(raw){
 const text=String(raw||'');
 const m=text.match(/(?:chi\s*tiết\s*đơn\s*theo\s*ngày|theo\s*ngày|ngày)\s*[:：-]?\s*([0-3]?\d)\s*[\/\-.]\s*([01]?\d)(?:\s*[\/\-.]\s*(20\d\d))?/i);
 if(!m)return null;
 const y=Number(m[3]||spxScanYear),mo=Number(m[2]),d=Number(m[1]);
 const date=new Date(y,mo-1,d);
 if(date.getFullYear()!==y||date.getMonth()!==mo-1||date.getDate()!==d)return null;
 return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
let spxScanYear=new Date().getFullYear();
parseOCR=function(text){const r=spxBaseParseOCR(text);r.date=spxDateFromText(text)||'';return r};
const spxOriginalChoosePhotos=choosePhotos;
choosePhotos=function(){
 spxMixedScan=false;
 spxScanYear=new Date().getFullYear();spxOriginalChoosePhotos();
};
function spxTypeLabel(t){return TYPES.find(x=>x.id===t)?.label||'Chưa rõ'}
function spxBatchStatus(item){
 const sum=(item.counts||[]).reduce((a,b)=>a+num(b),0);
 if(!/^20\d\d-\d\d-\d\d$/.test(item.date||''))return ['bad','Thiếu ngày/tháng'];
 if(!['giao','lay','hoan'].includes(item.type))return ['bad','Thiếu nhiệm vụ'];
 if(item.expected===null||item.expected===undefined)return ['bad','Thiếu tổng SPX'];
 if(sum!==Number(item.expected))return ['bad','Tổng không khớp'];
 if(!item.manuallyVerified && !item.ocrAutoVerified)return ['bad','Cần kiểm tra mốc cân hoặc ảnh bị cắt'];
 return ['ok',item.manuallyVerified?'Đã kiểm tra thủ công':'Khớp tổng · mốc hiển thị đã đối chiếu'];
}
function spxBatchKey(r){return (r.date||'')+'|'+(r.type||'')}
function spxBatchSame(a,b){return spxBatchKey(a)===spxBatchKey(b)&&JSON.stringify(a.counts)===JSON.stringify(b.counts)}
function spxBatchDuplicates(){
 const seen=new Map(),result=new Map();
 pending.forEach((r,i)=>{if(!r.date||!r.type)return;const k=spxBatchKey(r);if(seen.has(k)){const j=seen.get(k);result.set(i,spxBatchSame(r,pending[j])?'same':'conflict');result.set(j,spxBatchSame(r,pending[j])?'same':'conflict')}else seen.set(k,i)});
 return result;
}
function spxBatchList(){
 pending.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
 const duplicates=spxBatchDuplicates();
 const rows=pending.map((r,i)=>{
  const [status,label]=spxBatchStatus(r),dup=duplicates.get(i),existing=records.some(x=>x.date===r.date&&x.type===r.type),sum=(r.counts||[]).reduce((a,b)=>a+num(b),0);
  const warn=dup==='same'?'Ảnh giống hệt':dup==='conflict'?'Cùng ngày/nhiệm vụ, khác số liệu':existing?'Đã có trong nhật ký':label;
  return `<div class="entry"><div class="between"><b>Ảnh ${i+1} · ${esc(r.date?r.date.split('-').reverse().join('/'):'Chưa có ngày')}</b><span class="${status==='ok'&&!dup&&!existing?'money':'danger'}">${esc(warn)}</span></div><p class="kicker">${esc(spxTypeLabel(r.type))} · ${sum} đơn · Tổng ảnh: ${r.expected??'?'}</p><div class="field" style="margin:8px 0"><label for="spxQuickType${i}" style="font-size:13px">Nhiệm vụ (chọn ngay, không cần quét lại)</label><select id="spxQuickType${i}" onchange="spxQuickSetType(${i},this.value)" style="padding:10px"><option value="" ${!r.type?'selected':''}>-- Chưa xác định --</option>${TYPES.slice(0,3).map(t=>`<option value="${t.id}" ${r.type===t.id?'selected':''}>${t.label}</option>`).join('')}</select></div><button class="smallbtn" onclick="spxBatchEdit(${i})">✎ Kiểm tra / Sửa</button> <button class="smallbtn danger" onclick="spxBatchRemove(${i})">Xóa khỏi danh sách</button></div>`;
 }).join('');
 const valid=pending.filter((r,i)=>spxBatchStatus(r)[0]==='ok'&&!duplicates.has(i)&&!records.some(x=>x.date===r.date&&x.type===r.type)).length;
 showModal(`<div class="between"><h2>📷 Kiểm tra ${pending.length} ảnh</h2><button class="link" onclick="closeModal()">✕</button></div><p class="muted">Mỗi ngày có thể có đủ 3 nhiệm vụ. Nếu máy chưa nhận ra gạch cam, chọn nhiệm vụ ngay trên từng ảnh; không cần quét lại.</p><div class="notice">${valid} ảnh có thể lưu ngay · ${pending.length-valid} ảnh cần xem lại hoặc đã tồn tại.</div><div style="max-height:56vh;overflow:auto">${rows||'<p>Danh sách trống.</p>'}</div><button class="btn full" onclick="spxBatchCommit()" ${!valid?'disabled':''}>✓ Lưu ${valid} ảnh hợp lệ</button><p class="foot">Ảnh trùng, thiếu ngày hoặc sai tổng sẽ được giữ lại để kiểm tra. Không tự cộng hoặc ghi đè dữ liệu cũ.</p>`);
}
function spxQuickSetType(i,type){if(!pending[i]||!['giao','lay','hoan'].includes(type))return;pending[i].type=type;spxBatchList()}
function spxBatchRemove(i){pending.splice(i,1);spxBatchList()}
function spxBatchEdit(i){const r=pending[i];const sum=r.counts.reduce((a,b)=>a+num(b),0);showModal(`<div class="between"><h2>Kiểm tra ảnh ${i+1}/${pending.length}</h2><button class="link" onclick="spxBatchList()">← Danh sách</button></div>${r.preview?`<img class="preview" src="${r.preview}">`:''}<div class="field"><label>Ngày trên ảnh</label><input id="recordDate" type="date" value="${esc(r.date||'')}"></div><div class="field"><label>Nhiệm vụ</label><select id="recordType"><option value="" ${!r.type?'selected':''}>-- Chọn nhiệm vụ --</option>${TYPES.slice(0,3).map(t=>`<option value="${t.id}" ${t.id===r.type?'selected':''}>${t.label}</option>`).join('')}</select></div><h3>8 mốc cân</h3>${weightsEditor(r.counts)}<div class="field"><label>Tổng SPX trên ảnh</label><input id="expected" type="number" min="0" value="${r.expected??''}"></div><div id="sumNotice" class="notice">Tổng 8 mốc: ${sum} đơn</div>${r.expected==null?`<button class="smallbtn" style="margin-bottom:12px" onclick="spxConfirmTotalFromImage()">✓ Tôi đã đối chiếu ảnh: tổng là ${sum} đơn</button>`:""}<button class="btn full" onclick="spxBatchApply(${i})">✓ Xác nhận ảnh này</button>${r.ocrDebug?`<details><summary>Chi tiết OCR</summary><pre style="white-space:pre-wrap;font-size:11px">${esc(r.ocrDebug)}</pre></details>`:''}`)}
function spxBatchApply(i){const date=$('#recordDate').value,type=$('#recordType').value,vals=WEIGHTS.map((_,j)=>$('#w'+j).value.trim()),expected=$('#expected').value.trim();if(!date||!['giao','lay','hoan'].includes(type)||vals.some(v=>!/^(0|[1-9]\d*)$/.test(v))||!/^(0|[1-9]\d*)$/.test(expected)){alert('Kiểm tra ngày, 8 số nguyên không âm và tổng SPX.');return}const counts=vals.map(Number),sum=counts.reduce((a,b)=>a+b,0);if(sum!==Number(expected)){alert('Tổng 8 mốc khác tổng SPX. Chưa thể xác nhận.');return}pending[i]={...pending[i],date,type,counts,expected:Number(expected),found:8,manuallyVerified:true};spxBatchList()}
function spxBatchCommit(){
 const duplicates=spxBatchDuplicates(),valid=[],remain=[];
 pending.forEach((r,i)=>{
  if(spxBatchStatus(r)[0]==='ok'&&!duplicates.has(i)&&!records.some(x=>x.date===r.date&&x.type===r.type))valid.push(r);
  else remain.push(r);
 });
 if(!valid.length){alert('Không có ảnh hợp lệ mới để lưu. Hãy kiểm tra các ảnh còn lại.');return}
 const now=Date.now(),newRecords=valid.map((r,i)=>({id:'batch_'+now+'_'+i,date:r.date,type:r.type,counts:r.counts.slice()}));
 const updated=records.concat(newRecords);
 try{localStorage.setItem('spx_records_v1',JSON.stringify(updated))}catch(e){alert('Không lưu được: '+e.message);return}
 records=updated;month=valid[valid.length-1].date.slice(0,7);pending=remain;
 if(remain.length){spxBatchList()}else{closeModal();switchPage('nhatky')}
}
// Override native batch completion and browser OCR completion by intercepting showReview.
const spxOldShowReview=showReview;
showReview=function(item,index){if(pending.length===1 && !spxMixedScan)spxOldShowReview(item,index);else spxBatchList()};
window.spxNativeDone=async function(){await Promise.allSettled(spxNativeTasks);pending=spxNativeResults.slice().sort((a,b)=>a.order-b.order).map(x=>x.item).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));if(pending.length){spxBatchList();if(spxNativeErrors.length)alert(spxNativeErrors.join('\n'))}else showModal('<h2>Không thể quét ảnh</h2><div class="notice">'+esc(spxNativeErrors.join('\n')||'Không có kết quả')+'</div><button class="btn full" onclick="closeModal()">Đóng</button>')};

// Goal tracking without altering the existing cumulative rate calculation.
let spxGoals={};try{spxGoals=JSON.parse(localStorage.getItem('spx_goals_v9')||'{}')||{}}catch(e){}
function spxSaveGoal(){const el=$('#spxGoalInput');if(!el||!/^(0|[1-9]\d*)$/.test(el.value)||!Number.isSafeInteger(Number(el.value))){alert('Nhập mục tiêu là số nguyên không âm.');return}spxGoals[month]=Number(el.value);try{localStorage.setItem('spx_goals_v9',JSON.stringify(spxGoals))}catch(e){alert('Không lưu được mục tiêu: '+e.message);return}render()}
function spxGoalPanel(){const goal=Number(spxGoals[month])||0,earned=allTotal(),pct=goal?Math.min(100,earned/goal*100):0;return `<div class="card"><h2>🎯 Mục tiêu thu nhập</h2><div class="field"><label>Mục tiêu thưởng tháng ${esc(month.split('-').reverse().join('/'))} (đ)</label><input id="spxGoalInput" type="number" min="0" step="1" value="${goal}"></div><button class="btn secondary" onclick="spxSaveGoal()">Lưu mục tiêu</button><div class="divider"></div><div class="between"><b>Đã đạt ${fmt(earned)}</b><b>${Math.round(pct)}%</b></div><div class="progress"><div style="width:${pct}%"></div></div><p class="muted">${goal?'Còn thiếu: '+fmt(Math.max(0,goal-earned)):'Đặt mục tiêu để theo dõi tiến độ.'}</p></div>`}
const spxSummaryBeforeGoal=renderSummary;
renderSummary=function(){return spxSummaryBeforeGoal()};

// One-button mixed-business scan. Keep individual business scan buttons unchanged.
let spxMixedScan=false;
function spxScanAllTypes(){
 spxMixedScan=true;
 spxScanYear=new Date().getFullYear();spxScanType=null;
 if(window.SPXNative&&typeof window.SPXNative.pickImages==='function'){window.SPXNative.pickImages();return}
 $('#photoInput').value='';$('#photoInput').click();
}
const spxSummaryWithScan=renderSummary;
renderSummary=function(){return spxSummaryWithScan()+`<div class="spx-home-actions"><button type="button" class="btn" onclick="spxScanAllTypes()">Quét tất cả</button><button type="button" class="btn secondary" onclick="switchPage('nhatky')">📅 Nhật ký</button></div>`};
// Do not add calendar, analytics, or navigation tabs.

$('#photoInput').addEventListener('change',e=>processPhotos([...e.target.files]));render();

// Chỉ xác nhận bằng thao tác của người dùng sau khi so sánh với ảnh gốc.
function spxConfirmTotalFromImage(){
 const fields=Array.from({length:8},(_,i)=>document.getElementById('w'+i));
 if(fields.some(x=>!x||!/^(0|[1-9]\d*)$/.test(x.value.trim()))){alert('Kiểm tra đủ 8 mốc cân trước.');return;}
 const sum=fields.reduce((n,x)=>n+Number(x.value),0);
 if(!confirm('Hãy nhìn lại ảnh SPX gốc. Mày xác nhận dòng Tổng trên ảnh đúng bằng '+sum+' đơn?\n\nChỉ chọn OK khi đã kiểm tra bằng mắt.'))return;
 const input=document.getElementById('expected');if(input){input.value=String(sum);input.dispatchEvent(new Event('input',{bubbles:true}));}
}
