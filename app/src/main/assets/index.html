// Detect the active SPX tab from the orange underline in the screenshot.
// This uses image pixels, not the OCR text (all three labels are present).
async function spxTypeFromScreenshot(source){
 if(!source)return null;
 try{
  const img=new Image();img.src=source;await img.decode();
  const w=480,h=Math.max(1,Math.round(img.naturalHeight*w/img.naturalWidth));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,w,h);
  const pix=ctx.getImageData(0,0,w,h).data;
  // Tab underline sits just below the three tab titles, normally in top 10-35%.
  // Reject isolated orange glyphs: demand multiple adjacent rows of orange pixels.
  const runs=[];
  for(let y=Math.floor(h*.09);y<Math.min(h-2,Math.floor(h*.36));y++){
   let start=-1;
   for(let x=Math.floor(w*.045);x<=Math.floor(w*.94);x++){
    const k=(y*w+x)*4,r=pix[k],g=pix[k+1],b=pix[k+2];
    const orange=r>=185&&r>g*1.55&&g>=35&&g<=175&&b<125&&g>b*1.20;
    if(orange&&start<0)start=x;
    if((!orange||x===Math.floor(w*.94))&&start>=0){
     const length=x-start;
     if(length>=Math.round(w*.045)&&length<=Math.round(w*.18))runs.push({y,x:(start+x)/2,length});
     start=-1;
    }
   }
  }
  const bands=new Map();
  for(const r of runs){const k=Math.round(r.y/5);if(!bands.has(k))bands.set(k,[]);bands.get(k).push(r)}
  const candidates=[];
  for(const group of bands.values()){
   const byCol=[[],[],[]];
   for(const r of group){const i=r.x<w*.32?0:r.x<w*.57?1:r.x<w*.84?2:-1;if(i>=0)byCol[i].push(r)}
   for(let i=0;i<3;i++)if(byCol[i].length>=2){
    const ys=new Set(byCol[i].map(v=>v.y));
    const len=byCol[i].reduce((a,v)=>a+v.length,0);
    if(ys.size>=2)candidates.push({i,len,rows:ys.size});
   }
  }
  candidates.sort((a,b)=>b.len-a.len);
  if(!candidates.length||candidates[0].len<55)return null;
  if(candidates[1]&&candidates[0].len<candidates[1].len*1.55)return null;
  return ['giao','lay','hoan'][candidates[0].i];
 }catch(e){return null}
}

showReview=function(item,index){if(pending.length===1 && !spxMixedScan)spxOldShowReview(item,index);else spxBatchList()};
window.spxNativeDone=async function(){await Promise.allSettled(spxNativeTypeJobs);spxNativeTypeJobs=[];pending=spxNativeResults.slice().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));if(pending.length){spxBatchList();if(spxNativeErrors.length)alert(spxNativeErrors.join('\n'))}else showModal('<h2>Không thể quét ảnh</h2><div class="notice">'+esc(spxNativeErrors.join('\n')||'Không có kết quả')+'</div><button class="btn full" onclick="closeModal()">Đóng</button>')};

// Goal tracking without altering the existing cumulative rate calculation.
let spxGoals={};try{spxGoals=JSON.parse(localStorage.getItem('spx_goals_v9')||'{}')||{}}catch(e){}
function spxSaveGoal(){const el=$('#spxGoalInput');if(!el||!/^(0|[1-9]\d*)$/.test(el.value)||!Number.isSafeInteger(Number(el.value))){alert('Nhập mục tiêu là số nguyên không âm.');return}spxGoals[month]=Number(el.value);try{localStorage.setItem('spx_goals_v9',JSON.stringify(spxGoals))}catch(e){alert('Không lưu được mục tiêu: '+e.message);return}render()}
function spxGoalPanel(){const goal=Number(spxGoals[month])||0,earned=allTotal(),pct=goal?Math.min(100,earned/goal*100):0;return `<div class="card"><h2>🎯 Mục tiêu thu nhập</h2><div class="field"><label>Mục tiêu thưởng tháng ${esc(month.split('-').reverse().join('/'))} (đ)</label><input id="spxGoalInput" type="number" min="0" step="1" value="${goal}"></div><button class="btn secondary" onclick="spxSaveGoal()">Lưu mục tiêu</button><div class="divider"></div><div class="between"><b>Đã đạt ${fmt(earned)}</b><b>${Math.round(pct)}%</b></div><div class="progress"><div style="width:${pct}%"></div></div><p class="muted">${goal?'Còn thiếu: '+fmt(Math.max(0,goal-earned)):'Đặt mục tiêu để theo dõi tiến độ.'}</p></div>`}
const spxSummaryBeforeGoal=renderSummary;
renderSummary=function(){return spxSummaryBeforeGoal()+spxGoalPanel()};

// One-button mixed-business scan. Keep individual business scan buttons unchanged.
let spxMixedScan=false;
function spxScanAllTypes(){
 spxMixedScan=true;
 const v=prompt('Năm của các ảnh cần quét (ảnh chỉ ghi ngày/tháng):',String(new Date().getFullYear()));
 if(v===null)return;
 if(!/^20\d{2}$/.test(v)){alert('Nhập năm hợp lệ gồm 4 chữ số.');return}
 spxScanYear=Number(v);spxScanType=null;
 if(window.SPXNative&&typeof window.SPXNative.pickImages==='function'){window.SPXNative.pickImages();return}
 $('#photoInput').value='';$('#photoInput').click();
}
const spxSummaryWithScan=renderSummary;
renderSummary=function(){return `<div class="card"><h2>📷 Quét tất cả nhiệm vụ</h2><p class="muted">Chọn ảnh Đơn Giao, Đơn Lấy và Đơn Trả cùng lúc. Nếu không xác định chắc nhiệm vụ, hãy chọn lại trong danh sách kiểm tra trước khi Lưu tất cả.</p><button class="btn full" onclick="spxScanAllTypes()">✦ Quét cả 3 nhiệm vụ</button></div>`+spxSummaryWithScan()};
// Do not add calendar, analytics, or navigation tabs.

$('#photoInput').addEventListener('change',e=>processPhotos([...e.target.files]));render();
</script></body></html>
