function sums(type){let a=Array(8).fill(0);monthly(type).forEach(r=>r.counts.forEach((n,i)=>a[i]+=num(n)));return a}
function bracket(type,count){if(!count)return null;return RATE_TABLE[type].find((r,i,arr)=>count>=r[0]&&(count<r[1]||i===arr.length-1))||null}
function reward(type,count,i){const r=bracket(type,count);return r?r[i+2]*1000:0}
function total(type){return sums(type).reduce((a,n,i)=>a+reward(type,n,i),0)}

function renderHints(t){let a=sums(t),count=a.reduce((x,y)=>x+y,0),r=bracket(t,count);let hints=a.map((n,i)=>{let current=bracket(t,n);let next=RATE_TABLE[t].find(row=>row[0]>=(current?current[1]:1));if(!next)return '';let need=Math.max(0,next[0]-n),gain=next[i+2]*1000-reward(t,n,i);if(gain<=0)return '';return {i,n,need,gain,range:range(current),next:range(next)}}).filter(Boolean).sort((a,b)=>a.i-b.i);return `<div class="between"><b>${TYPES.find(x=>x.id===t).icon} ${TYPES.find(x=>x.id===t).label}</b><span class="tag">${fmt(total(t))} • ${count} đơn</span></div><div class="progress"><div style="width:${r?Math.max(2,Math.min(100,100*(count-r[0])/Math.max(1,r[1]-r[0]))):0}%"></div></div>${hints.length?hints.map(h=>`<div class="hint"><div><b>${WEIGHTS[h.i]}</b> (${h.n} đơn)<br><span class="kicker">Cần thêm ${h.need} đơn để đạt mốc ${h.next}</span></div><em>+${fmt(h.gain)}</em></div>`).join(''):'<p class="muted">Chưa có mốc tiếp theo.</p>'}<div class="divider"></div>`}

function exportCSV(){const rows=[['Ngày','Nghiệp vụ',...WEIGHTS,'Tổng đơn'],...records.filter(r=>r.date.startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date)).map(r=>[r.date,TYPES.find(t=>t.id===r.type)?.label,...r.counts,r.counts.reduce((a,b)=>a+b,0)]),[],['Tháng',month],['Nghiệp vụ','Tổng đơn','Tiền thưởng (VND)'],...TYPES.slice(0,3).map(t=>[t.label,sums(t.id).reduce((a,b)=>a+b,0),total(t.id)]),['TỔNG', '',allTotal()]];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),`SPX_${month}.csv`)}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function parseOCR(text){let s=text.replace(/\r/g,'').replace(/[–—]/g,'-');let type=/đã\s*(?:trả\s*hàng|hoàn)|trả\s*hàng/i.test(s)?'hoan':/đã\s*lấy/i.test(s)?'lay':'giao';let date=today(),m=s.match(/(?:chi\s*tiết\s*đơn\s*theo\s*ngày|theo\s*ngày)[^\n]*?([0-3]?\d)[\/\-.]([01]?\d)(?:[\/\-.](20\d{2}))?/i);if(m){const year=m[3]||month.slice(0,4);const d=String(m[1]).padStart(2,'0'),mo=String(m[2]).padStart(2,'0');if(+mo<=12&&+d<=31)date=`${year}-${mo}-${d}`}
let expected=null;const totalMatch=s.match(/t[oôổ]ng\s*([\d., ]+)\s*(?:đ[oơ]n|don)/i);if(totalMatch)expected=Number(totalMatch[1].replace(/\D/g,''));
// Tìm mỗi thẻ theo cặp khoảng khối lượng + số đơn, kể cả khi OCR đảo vị trí theo dòng.
const counts=Array(8).fill(0);const lines=s.split('\n').map(x=>x.trim()).filter(Boolean);const starts=[0,2.001,4.001,6.001,8.001,10.001,12.001,15.001];let found=0;
for(let i=0;i<lines.length;i++){let l=lines[i];let w=l.match(/(\d{1,2})[.,](\d{3})\s*[-~]\s*(\d{1,2})[.,](\d{3})/);if(!w)continue;let lower=Number(w[1]+'.'+w[2]);let idx=starts.findIndex(x=>Math.abs(x-lower)<.12);if(idx<0)continue;let candidates=[];for(let j=Math.max(0,i-2);j<=Math.min(lines.length-1,i+3);j++){if(/t[oôổ]ng/i.test(lines[j]))continue;let matches=[...lines[j].matchAll(/(\d{1,6})\s*(?:đ[oơ]n\s*h[aà]ng|đ[oơ]n|don\s*hang)/gi)];for(let n of matches)candidates.push({value:Number(n[1]),distance:Math.abs(j-i)})}candidates.sort((a,b)=>a.distance-b.distance);if(candidates.length){counts[idx]=candidates[0].value;found++}}
// Fallback: trên một số bản OCR, số đơn nằm trước dòng khối lượng.
return {date,type,counts,expected,found,text:s}}
// OCR riêng cột số lượng bên phải, giữ thứ tự các thẻ cân nặng trên ảnh SPX.
// Không dùng số ví dụ cố định; mọi số đều được đọc từ ảnh vừa tải lên.
// Đọc theo từng thẻ độc lập thay vì OCR cả cột: tránh bỏ sót thẻ thứ hai.
// V5: identify actual weight labels first, then associate count in SAME visual card.
// Never assume cards are consecutive weight bins; SPX hides zero-count bins.
function weightIndex(raw){
 const t=String(raw||'').replace(/[Oo]/g,'0').replace(/[,]/g,'.').replace(/[–—~]/g,'-');
 const over=t.match(/15\s*\.\s*0{0,2}1\s*-\s*(?:999999|999[.,]?999)/);if(over)return 7;
 const matches=[...t.matchAll(/(\d{1,2})\s*\.\s*(\d{2,3})\s*-\s*(\d{1,2})\s*\.\s*(\d{2,3})/g)];
 for(const m of matches){const low=Number(m[1])+Number(m[2])/Math.pow(10,m[2].length);const high=Number(m[3])+Number(m[4])/Math.pow(10,m[4].length);const starts=[0,2,4,6,8,10,12,15];let ix=starts.findIndex((v,i)=>Math.abs(v-low)<.14 && (i===7||Math.abs([2,4,6,8,10,12,15][i]-high)<.14));if(ix>=0)return ix;}
 return -1;
}
function countFromText(text){const t=String(text||'').replace(/\n/g,' ');const m=t.match(/(?:^|\s)(\d{1,6})\s*(?:đ[oơ]n|d[oơ]n|don)/i);return m?Number(m[1]):null}
async function imageObj(data){const img=new Image();img.src=data;await img.decode();return img}
async function cropOCR(worker,img,x,y,w,h,scale=2.5){const c=document.createElement('canvas');c.width=Math.round(w*scale);c.height=Math.round(h*scale);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,x,y,w,h,0,0,c.width,c.height);return (await worker.recognize(c.toDataURL('image/png'))).data.text||''}
// V8: nhận diện dựa trên NHÃN CÂN của từng thẻ, không gán theo vị trí/thứ tự.
// Thẻ cuối bị cắt vẫn được xử lý; ảnh không đủ thông tin thì giữ cảnh báo, không đoán.
async function scanMappedCards(worker,data,expected){
 const img=await imageObj(data),W=img.width,H=img.height;
 const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
 const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);
 const pixels=ctx.getImageData(0,0,W,H).data;
 const hits=[];
 const step=Math.max(2,Math.floor(W/180));
 // Tìm đường viền ngang theo toàn bộ khu vực nội dung, kể cả thẻ cuối.
 for(let y=Math.floor(H*.22);y<Math.floor(H*.985);y+=2){let count=0,samples=0;
  for(let x=Math.floor(W*.075);x<Math.floor(W*.92);x+=step){let k=(y*W+x)*4,r=pixels[k],g=pixels[k+1],b=pixels[k+2];
   if(r>207&&r<249&&Math.abs(r-g)<13&&Math.abs(g-b)<13)count++;samples++}
  if(count>samples*.64)hits.push(y);
 }
 const groups=[];for(const y of hits){if(!groups.length||y-groups[groups.length-1].at(-1)>10)groups.push([y]);else groups[groups.length-1].push(y)}
 const lines=groups.map(g=>Math.round(g.reduce((a,b)=>a+b,0)/g.length));
 const cards=[];
 for(let i=0;i+1<lines.length;i++){const d=lines[i+1]-lines[i];if(d>W*.14&&d<W*.34)cards.push([lines[i],lines[i+1]]);}
 const heights=cards.map(c=>c[1]-c[0]).sort((a,b)=>a-b);
 const typical=heights.length?heights[Math.floor(heights.length/2)]:Math.round(W*.23);
 // Bổ sung thẻ đang lộ ra một phần ở đáy màn hình.
 for(const y of lines){if(y<H*.28||y>H*.97||cards.some(c=>Math.abs(c[0]-y)<12))continue;
  const remain=H-y;if(remain>Math.min(typical*.30,W*.085))cards.push([y,Math.min(H-2,y+typical)]);
 }
 cards.sort((a,b)=>a[0]-b[0]);
 const counts=Array(8).fill(0),seen=new Set(),debug=[];
 for(const [top,bottom] of cards){let h=bottom-top;if(top<H*.22||h<W*.065)continue;
  // Quét toàn bộ chiều cao thẻ, không bỏ 17% đầu/cuối như V7.
  const cropY=Math.max(0,top+2),cropH=Math.min(H-cropY,Math.max(20,h-3));
  const left=await cropOCR(worker,img,Math.round(W*.08),cropY,Math.round(W*.55),cropH,3);
  let idx=weightIndex(left);
  // OCR toàn thẻ nếu nhãn bên trái không đọc rõ.
  let whole='';if(idx<0){whole=await cropOCR(worker,img,Math.round(W*.07),cropY,Math.round(W*.86),cropH,2.5);idx=weightIndex(whole)}
  if(idx<0){debug.push('Không nhận được nhãn cân tại y='+top+': '+left.trim().replace(/\n/g,' '));continue}
  const right=await cropOCR(worker,img,Math.round(W*.56),cropY,Math.round(W*.38),cropH,3.2);
  let value=countFromText(right);
  if(value===null&&whole)value=countFromText(whole);
  if(value===null){const m=right.match(/(?:^|\s)(\d{1,5})(?:\s|$)/);if(m)value=Number(m[1])}
  if(value!==null&&!seen.has(idx)){counts[idx]=value;seen.add(idx)}
  debug.push(WEIGHTS[idx]+': '+(value===null?'KHÔNG ĐỌC ĐƯỢC':value)+' | '+right.trim().replace(/\n/g,' '));
 }
 return {counts,found:seen.size,debug:debug.join('\n'),cards:cards.length,valid:seen.size>0,matched:expected!==null&&counts.reduce((a,b)=>a+b,0)===expected};
}
async function readImage(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(file)})}
async function loadTesseract(){if(window.Tesseract)return;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('Không tải được bộ OCR. Kiểm tra kết nối Internet.'));document.head.appendChild(s)})}
async function selectedTab(data){try{let im=new Image();im.src=data;await im.decode();let c=document.createElement('canvas');c.width=420;c.height=Math.round(im.height*420/im.width);let ctx=c.getContext('2d');ctx.drawImage(im,0,0,c.width,c.height);let pixels=ctx.getImageData(0,0,c.width,Math.floor(c.height*.32)).data;let bands=[0,0,0];for(let y=Math.floor(c.height*.11);y<Math.floor(c.height*.28);y++)for(let x=45;x<300;x++){let k=(y*c.width+x)*4,r=pixels[k],g=pixels[k+1],b=pixels[k+2];if(r>170&&r>g*1.4&&g>b*.85&&g<150){bands[Math.min(2,Math.floor((x-45)/85))]++}}let max=Math.max(...bands);return max>12?['giao','lay','hoan'][bands.indexOf(max)]:null}catch(e){return null}}
async function processPhotos(files){if(!files.length)return;showModal(`<h2>✦ Đang phân tích ảnh SPX</h2><p class="muted">V9: Nhận cả nhóm trên 15 kg và quét đủ 8 mốc cân theo nhãn thực tế, nhận thẻ sát mép ảnh, kiểm tra tổng trước khi lưu.</p><progress id="ocrProgress" max="100" value="0"></progress><p id="ocrStatus">Đang chuẩn bị…</p>`);let worker=null;try{await loadTesseract();worker=await Tesseract.createWorker('vie+eng',1,{logger:m=>{let p=$('#ocrProgress');if(p&&m.progress)p.value=Math.round(m.progress*100);let el=$('#ocrStatus');if(el)el.textContent=`${m.status||'Đang nhận diện'} ${m.progress?Math.round(m.progress*100)+'%':''}`}});let results=[];for(let i=0;i<files.length;i++){const data=await readImage(files[i]);let el=$('#ocrStatus');if(el)el.textContent=`Đang đọc các thẻ ảnh ${i+1}/${files.length}. Có thể mất 1–2 phút…`;const out=await worker.recognize(data);const parsed=parseOCR(out.data.text);const mapped=await scanMappedCards(worker,data,parsed.expected);parsed.counts=mapped.counts;parsed.found=mapped.found;parsed.ocrDebug=mapped.debug;
 // Cross-check with the full-image OCR. Only supplement a missing weight when
 // the full text explicitly identifies that weight and its own count.
 if(parsed.expected!==null && parsed.counts.reduce((a,b)=>a+b,0)!==parsed.expected){
   const candidate=parseOCR(out.data.text);
   const candidateSum=candidate.counts.reduce((a,b)=>a+b,0);
   const merged=parsed.counts.map((v,j)=>v||candidate.counts[j]||0);
   if(candidateSum===parsed.expected && candidate.found>=mapped.found){parsed.counts=candidate.counts;parsed.ocrDebug+='\nDùng kết quả toàn ảnh vì khớp tổng SPX.';}
   else if(merged.reduce((a,b)=>a+b,0)===parsed.expected){parsed.counts=merged;parsed.ocrDebug+='\nBổ sung thẻ bị cắt từ OCR toàn ảnh.';}
 }
 parsed.found=parsed.counts.filter(v=>v>0).length;parsed.ocrCards=mapped.cards;parsed.type=(await selectedTab(data))||parsed.type;results.push({...parsed,preview:data});}pending=results;if(results.length)showReview(results[0],0);else closeModal()}catch(e){showModal(`<h2>Không thể quét ảnh</h2><div class="notice">${esc(e.message)}</div><button class="btn full" onclick="closeModal()">Đóng</button>`)}finally{if(worker)await worker.terminate()}}
$('#photoInput').addEventListener('change',e=>processPhotos([...e.target.files]));render();
</script></body></html>
