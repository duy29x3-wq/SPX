plugins {
    id 'com.android.application'
}

android {
    namespace 'com.spx.v9'
    compileSdk 35

    defaultConfig {
        applicationId 'com.spx.v9'
        minSdk 24
        targetSdk 35
        versionCode 11
        versionName '11.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('SPX_KEYSTORE_PATH') ?: 'spx-v9-release.jks')
            storePassword System.getenv('SPX_KEYSTORE_PASSWORD') ?: ''
            keyAlias 'spxv9'
            keyPassword System.getenv('SPX_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
