
name: Build San Luong Don APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        shell: bash
        run: |
          set -e
          test -d "$ANDROID_HOME/platforms"
          test -d "$ANDROID_HOME/build-tools"
          echo "Android SDK ready"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore JKS signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SPX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing keystore secret"
            exit 1
          fi

          mkdir -p app

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > app/spx-v9-release.jks

          test -s app/spx-v9-release.jks

          echo "Keystore restored"

      - name: Build signed Release APK
        env:
          SPX_KEYSTORE_PASSWORD: ${{ secrets.SPX_KEYSTORE_PASSWORD }}
          SPX_KEY_PASSWORD: ${{ secrets.SPX_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "Release APK not found"
            exit 1
          fi

          cp "$APK" "Sản Lượng Đơn.apk"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "Sản Lượng Đơn.apk"

          echo "APK signature verified"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: San-Luong-Don
          path: Sản Lượng Đơn.apk
          if-no-files-found: error
          retention-days: 30
